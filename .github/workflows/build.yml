name: Build Image & Upload Single tar.gz to HuggingFace

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag。留空则按镜像内实际版本自动派生，形如 cu133-py312-vllm0.31.0-swift4.6.0-rl；填写后使用指定值'
        required: false
        default: ''
      hf_repo_id:
        description: '填入你的 HuggingFace 仓库名 (格式: 你的HF用户名/llm-docker-images，若不存在会自动创建)'
        required: true
        default: 'yippp/llm-docker-images'
      hf_private:
        description: '是否将 HuggingFace 仓库设为私有 (Private)？(公开仓库免登录即可直链下载)'
        type: boolean
        required: true
        default: false
      upload_github_release:
        description: '是否同时切分上传一份到 GitHub Releases 作为备用？'
        type: boolean
        required: true
        default: false

jobs:
  build-push-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 清理磁盘，释放约 105GB 空间
      - name: Free Disk Space (105GB+)
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show Disk Space Before Build
        run: df -h

      # 从 Dockerfile 的 ARG 读取版本参数，避免 workflow 与 Dockerfile 各自维护一份版本号
      - name: Read Version Args From Dockerfile
        id: args
        run: |
          PY=$(sed -n 's/^ARG PYTHON_VERSION=\(.*\)$/\1/p' Dockerfile | head -n1)
          echo "Dockerfile 锁定 Python: ${PY}"
          echo "python=${PY}" >> "$GITHUB_OUTPUT"

      # 2. 直接在宿主机 Docker Daemon 构建镜像
      - name: Build Docker Image on Host Daemon
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build -t local-test:verify .
          df -h

      # 3. 构建结果验证
      - name: Verify CLI Tools, Jupyter, Agents & LLM/VLM/RL Frameworks
        run: |
          echo "=== [1/3] 验证系统工具、FFmpeg、Jupyter 与 Coding Agents ==="
          docker run --rm local-test:verify bash -c "
            set -e
            conda --version && tmux -V && nvitop --version
            ffmpeg -version | head -n 1
            rg --version | head -n 1 && fd --version && ast-grep --version
            jq --version && yq --version && gh --version | head -n 1
            nvcc --version | grep -i release
            jupyter lab --version && jupyter notebook --version
            jupyter kernelspec list | grep -E 'python3[0-9]+'
            node -v && npm -v && bun -v
            which herdr && herdr --help > /dev/null
            which pi && pi --version
            which ck && ck --version
            which qmd && qmd --help > /dev/null
          "

          echo "=== [2/3] 验证 Python、OpenAI NamespaceTool、vLLM 与全部依赖库 ==="
          docker run --rm -e EXPECTED_PY="${{ steps.args.outputs.python }}" local-test:verify python -c "
          import sys, os, importlib.metadata as meta
          import numpy as np, pyarrow as pa, scipy, sklearn, cv2, pandas as pd
          import openai
          from openai.types.responses import NamespaceTool
          import torch, torchvision, torchaudio, transformers, datasets, peft, trl, deepspeed
          import modelscope, vllm, swift
          from vllm import LLM, SamplingParams
          import timm, decord, librosa, qwen_vl_utils, qwen_omni_utils
          import ray, math_verify, gymnasium, wandb, swanlab

          _exp = os.environ.get('EXPECTED_PY', '')
          _got = f'{sys.version_info[0]}.{sys.version_info[1]}'
          assert not _exp or _got == _exp, f'Python version mismatch: expected {_exp}, got {_got}'
          assert int(np.__version__.split('.')[0]) >= 2, f'Expected NumPy 2.x, got {np.__version__}'
          assert hasattr(np, 'float_') and hasattr(np, 'NaN'), 'NumPy 1.x compatibility shim missing!'

          print('✅ Python:      ', sys.version.split()[0])
          print('✅ NumPy:       ', np.__version__, '(PyArrow:', pa.__version__, '| 1.x shim active)')
          print('✅ OpenAI SDK:  ', openai.__version__, '(NamespaceTool verified)')
          print('✅ PyTorch:     ', torch.__version__, '| Vision:', torchvision.__version__, '| CUDA:', torch.version.cuda)
          print('✅ Transformers:', transformers.__version__)
          print('✅ Datasets:    ', datasets.__version__)
          print('✅ TRL:         ', trl.__version__)
          print('✅ DeepSpeed:   ', deepspeed.__version__)
          print('✅ Ray:         ', ray.__version__)
          print('✅ vLLM:        ', vllm.__version__)
          print('✅ ms-swift:    ', swift.__version__)
          print('✅ FLA:         ', meta.version('flash-linear-attention'))
          "

          echo "=== [3/3] 验证 DeepSpeed 预编译算子与 CLI 入口 ==="
          docker run --rm local-test:verify bash -c "
            set -e
            ds_report
            which vllm && which swift
            swift --help > /dev/null
            ls -la /root/.cache/modelscope/_github/Megatron-LM
            ls -la /opt/StartLux-Decision
          "
          echo "🎉 所有静态检查 100% 通过！"

      # 3.5 从构建好的镜像读取实际版本，自动生成 tag，不需要手动填写 input
      - name: Derive Image Tag From Built Image
        id: meta
        env:
          MANUAL_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_TAG" ]; then
            echo "使用手动指定的 tag: $MANUAL_TAG"
            echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "=== 从镜像内 /opt/versions.env 读取实际版本 ==="
          docker run --rm local-test:verify cat /opt/versions.env | tee /tmp/versions.env
          set -a
          . /tmp/versions.env
          set +a

          : "${CU:?镜像 /opt/versions.env 缺字段 CU，无法自动派生 tag}"
          : "${PY:?镜像 /opt/versions.env 缺字段 PY，无法自动派生 tag}"
          : "${VLLM:?镜像 /opt/versions.env 缺字段 VLLM，无法自动派生 tag}"
          : "${SWIFT:?镜像 /opt/versions.env 缺字段 SWIFT，无法自动派生 tag}"

          TAG="cu${CU//./}-py${PY//./}-vllm${VLLM}-swift${SWIFT}-rl"
          echo "自动派生 tag: $TAG"
          echo "（CUDA ${CU} / Python ${PY} / vLLM ${VLLM} / ms-swift ${SWIFT}）"
          echo "（torch ${TORCH:-?} / DeepSpeed ${DEEPSPEED:-?} / flash-attn ${FLASH_ATTN:-?}）"
          if [ "${FLASH_ATTN:-none}" = "none" ]; then
            echo "::warning::镜像内没有 flash-attn（没有匹配的预编译轮子），需要时查看构建日志第 5 步的 WARNING"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 4. 登录并推送到 GHCR 镜像仓库
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR & Clean Build Cache
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ steps.meta.outputs.tag }}"
          IMAGE_URI="ghcr.io/${OWNER_LOWER}/llm-env:${TAG}"
          docker tag local-test:verify "$IMAGE_URI"
          docker push "$IMAGE_URI"
          docker builder prune -af || true
          df -h

      # 5. 导出完整单文件 .tar.gz 并直接上传到你的 HuggingFace Dataset 仓库
      - name: Export Single .tar.gz and Upload Directly to HuggingFace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo_id }}
          HF_PRIV: ${{ inputs.hf_private }}
          DO_GH_RELEASE: ${{ inputs.upload_github_release }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          sudo apt-get update && sudo apt-get install -y pigz
          EXPORT_DIR="${RUNNER_TEMP}/export"
          mkdir -p "$EXPORT_DIR"

          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${OWNER_LOWER}/llm-env:${TAG_NAME}"
          TAR_FILE="${EXPORT_DIR}/llm-env-${TAG_NAME}.tar.gz"

          echo "=== [1/2] 正在使用 4 核 pigz 导出完整单文件压缩包: ${TAR_FILE} ==="
          docker save "$IMAGE_URI" | pigz -fast -p 4 > "$TAR_FILE"
          ls -lh "$TAR_FILE"
          sha256sum "$TAR_FILE" > "${TAR_FILE}.sha256"

          # 导出完成后立即删除本地 Docker 镜像，释放约 25GB 空间
          docker rmi -f "$IMAGE_URI" local-test:verify || true
          df -h

          if [ -n "$HF_TOKEN" ] && [ -n "$HF_REPO" ]; then
            echo "=== [2/2] 正在将完整单文件 .tar.gz 直传到 HuggingFace: ${HF_REPO} ==="
            pip install -q --break-system-packages -U "huggingface_hub"
            HF_XET_HIGH_PERFORMANCE=1 python3 - << 'PYEOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_REPO"].strip()
          is_private = os.environ.get("HF_PRIV", "false").lower() == "true"
          tar_path = os.environ["TAR_FILE"] if "TAR_FILE" in os.environ else None
          tag_name = os.environ["TAG_NAME"]
          export_dir = os.environ["RUNNER_TEMP"] + "/export"
          fname = f"llm-env-{tag_name}.tar.gz"

          api = HfApi(token=token)
          # 若仓库不存在则自动创建 Dataset 仓库
          api.create_repo(repo_id=repo_id, repo_type="dataset", private=is_private, exist_ok=True)

          print(f"Uploading {fname} to HuggingFace dataset {repo_id}...")
          api.upload_file(
              path_or_fileobj=f"{export_dir}/{fname}",
              path_in_repo=fname,
              repo_id=repo_id,
              repo_type="dataset",
              commit_message=f"Upload Docker image {fname}"
          )
          api.upload_file(
              path_or_fileobj=f"{export_dir}/{fname}.sha256",
              path_in_repo=f"{fname}.sha256",
              repo_id=repo_id,
              repo_type="dataset",
              commit_message=f"Upload SHA256 for {fname}"
          )
          print("==================================================================")
          print(f"✅ 上传成功。完整单文件下载地址：")
          print(f"🌐 HuggingFace 直链: https://huggingface.co/datasets/{repo_id}/resolve/main/{fname}")
          print(f"🚀 国内镜像直链 (hf-mirror.com): https://hf-mirror.com/datasets/{repo_id}/resolve/main/{fname}")
          print("==================================================================")
          PYEOF
          else
            echo "⚠️ 未检测到 Secrets 中的 HF_TOKEN，跳过 HuggingFace 上传"
          fi

          # (可选) 如果勾选了同时上传 GitHub Release 备份，再切分上传
          if [ "$DO_GH_RELEASE" = "true" ]; then
            echo "=== 正在切分上传备份至 GitHub Releases ==="
            split -b 1900M -d -a 2 "$TAR_FILE" "${TAR_FILE}.part"
            rm -f "$TAR_FILE"
            RELEASE_TAG="img-${TAG_NAME}"
            gh release delete "$RELEASE_TAG" --repo "${{ github.repository }}" -y --cleanup-tag 2>/dev/null || true
            gh release create "$RELEASE_TAG" "${EXPORT_DIR}"/* \
              --repo "${{ github.repository }}" \
              --title "Docker Image: ${TAG_NAME}" \
              --notes "完整单文件请前往 HuggingFace 下载：https://huggingface.co/datasets/${HF_REPO}/tree/main"
          fi
