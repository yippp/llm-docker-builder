name: Build Image & Export tar.gz to Release / HF

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag'
        required: true
        default: 'cu133-py312-vllm031-swift46-sglang-rl'
      export_tar:
        description: '是否导出 .tar.gz 压缩包并发布到 GitHub Releases 下载？'
        type: boolean
        required: true
        default: true
      hf_repo_id:
        description: '(可选) 填入你的 HuggingFace 数据集仓库名以直传完整单文件 tar.gz (如 yippp/docker-images，需在 Secrets 配 HF_TOKEN)'
        required: false
        default: ''

jobs:
  build-push-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write   # 允许自动创建 GitHub Release 并上传 .tar.gz 下载包
      packages: write   # 允许推送到 GHCR 镜像仓库

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 深度清理磁盘，释放 ~105GB 可用空间（足够放下镜像 + 导出的 tar.gz）
      - name: Free Disk Space (105GB+)
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show Disk Space Before Build
        run: df -h

      # 2. 直接在宿主机 Docker Daemon 构建镜像
      - name: Build Docker Image on Host Daemon
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build -t local-test:verify .
          df -h

      # 3. 自动化无 Bug 验证（验证 CLI、Jupyter、Agent、DeepSpeed 预编译算子与各大框架）
      - name: Verify CLI Tools, Jupyter, Agents & LLM/VLM/RL Frameworks
        run: |
          echo "=== [1/4] 验证系统工具、FFmpeg、Jupyter 与 Coding Agents ==="
          docker run --rm local-test:verify bash -c "
            set -e
            conda --version && tmux -V && nvitop --version
            ffmpeg -version | head -n 1
            rg --version | head -n 1 && fd --version && ast-grep --version
            jq --version && yq --version && gh --version | head -n 1
            nvcc --version | grep '13.3'
            jupyter lab --version && jupyter notebook --version
            jupyter kernelspec list | grep 'python312'
            node -v && npm -v && bun -v
            which herdr && herdr --help > /dev/null
            which pi && pi --version
            which ck && ck --version
            which qmd && qmd --help > /dev/null
          "

          echo "=== [2/4] 验证 Python 3.12 与 LLM/VLM/RL/决策模型核心库 ==="
          docker run --rm local-test:verify python -c "
          import sys, torch, transformers, datasets, peft, trl, deepspeed
          import modelscope, vllm, vllm._C, swift
          import timm, decord, librosa, qwen_vl_utils, qwen_omni_utils
          import ray, math_verify, gymnasium, wandb, swanlab, fla
          assert sys.version_info[:2] == (3, 12), f'Python version mismatch: {sys.version}'
          print('Python:      ', sys.version.split()[0])
          print('PyTorch:     ', torch.__version__, 'CUDA:', torch.version.cuda)
          print('Transformers:', transformers.__version__)
          print('Datasets:    ', datasets.__version__)
          print('TRL:         ', trl.__version__)
          print('DeepSpeed:   ', deepspeed.__version__)
          print('Ray:         ', ray.__version__)
          print('vLLM:        ', vllm.__version__)
          print('ms-swift:    ', swift.__version__)
          print('FLA:         ', fla.__version__)
          "

          echo "=== [3/4] 验证 SGLang、DeepSpeed 预编译算子与 CLI 入口 ==="
          docker run --rm local-test:verify bash -c "
            set -e
            if python -c 'import sglang' 2>/dev/null; then
              python -c 'import sglang; print(\"SGLang (main env):\", sglang.__version__)'
            else
              /opt/sglang-env/bin/python -c 'import sglang; print(\"SGLang (/opt/sglang-env):\", sglang.__version__)'
            fi
            ds_report
            vllm --help > /dev/null
            swift --help > /dev/null
            ls -la /root/.cache/modelscope/_github/Megatron-LM
            ls -la /opt/StartLux-Decision
          "
          echo "🎉 所有静态检查 100% 通过！"

      # 4. 登录并推送到 GHCR 镜像仓库
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR & Clean Build Cache
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${OWNER_LOWER}/llm-env:${{ github.event.inputs.image_tag }}"
          docker tag local-test:verify "$IMAGE_URI"
          docker push "$IMAGE_URI"
          # 推送完成后清理 BuildKit 缓存，腾出最大化磁盘空间给 tar.gz 导出
          docker builder prune -af || true
          df -h

      # 5. 【方案 B 核心】使用 pigz 4 核极速导出 .tar.gz 并上传到 GitHub Releases & HuggingFace
      - name: Export .tar.gz and Upload to GitHub Release / HuggingFace
        if: ${{ inputs.export_tar == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo_id }}
          TAG_NAME: ${{ inputs.image_tag }}
        run: |
          sudo apt-get update && sudo apt-get install -y pigz
          mkdir -p /mnt/export

          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${OWNER_LOWER}/llm-env:${TAG_NAME}"
          TAR_GZ_PATH="/mnt/export/llm-env-${TAG_NAME}.tar.gz"

          echo "=== [1/3] 正在使用 4 核 pigz 并行导出压缩镜像: ${TAR_GZ_PATH} ==="
          docker save "$IMAGE_URI" \vert{} pigz -fast -p 4 > "$TAR_GZ_PATH"
          ls -lh "$TAR_GZ_PATH"
          sha256sum "$TAR_GZ_PATH" > "${TAR_GZ_PATH}.sha256"

          # 如果配置了 HF_REPO 和 HF_TOKEN，先把未切分的完整单文件 .tar.gz 直传到 HuggingFace
          if [ -n "$HF_REPO" ] && [ -n "$HF_TOKEN" ]; then
            echo "=== [2/3] 检测到 HuggingFace 配置，正在上传完整单文件 .tar.gz 到 ${HF_REPO} ==="
            pip install -q "huggingface_hub[cli,hf_transfer]"
            HF_HUB_ENABLE_HF_TRANSFER=1 huggingface-cli upload "$HF_REPO" "$TAR_GZ_PATH" "llm-env-${TAG_NAME}.tar.gz" --repo-type dataset --token "$HF_TOKEN"
            echo "✅ 完整单文件已上传至: https://huggingface.co/datasets/${HF_REPO}/tree/main"
          fi

          # 删除本地 Docker 镜像释放出 25GB 空间，接着切分为 1.9GB 分卷上传到 GitHub Releases（突破 GitHub 单附件 2GB 限制）
          docker rmi -f "$IMAGE_URI" local-test:verify || true
          echo "=== [3/3] 正在切分为 1900MB 分卷并自动发布到本仓库 GitHub Releases ==="
          split -b 1900M -d -a 2 "$TAR_GZ_PATH" "${TAR_GZ_PATH}.part"
          rm -f "$TAR_GZ_PATH"
          ls -lh /mnt/export/

          RELEASE_TAG="img-${TAG_NAME}"
          gh release delete "$RELEASE_TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" /mnt/export/* \
            --title "Docker Image: ${TAG_NAME}" \
            --notes "### 📦 镜像下载与还原指南

          **方式一：直接拉取镜像**
          \`\`\`bash
          docker pull ${IMAGE_URI}
          \`\`\`

          **方式二：下载本页下方的分卷包合并为完整 \`.tar.gz\` 或 \`.tar\` 上传算力平台**
          1. 将下方所有 \`.part00\`, \`.part01\`... 文件下载到同一文件夹。
          2. **Linux / WSL2 / Mac 合并还原命令**：
             \`\`\`bash
             # 合并为完整 .tar.gz (若平台支持直接传 .tar.gz)
             cat llm-env-${TAG_NAME}.tar.gz.part* > llm-env-${TAG_NAME}.tar.gz

             # 若平台只支持未压缩的 .tar，再执行一行解压（保留或生成 .tar）：
             gunzip -c llm-env-${TAG_NAME}.tar.gz > llm-env-${TAG_NAME}.tar
             \`\`\`
          3. **Windows (CMD / PowerShell) 合并还原命令**：
             \`\`\`cmd
             cmd /c copy /b llm-env-${TAG_NAME}.tar.gz.part* llm-env-${TAG_NAME}.tar.gz
             \`\`\`"
          echo "🎉 镜像分卷已成功发布到你仓库的 Releases 页面，可直接用 IDM/浏览器满速下载！"
