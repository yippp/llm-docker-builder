name: Build All-in-One LLM & Agent Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag'
        required: true
        default: 'cu133-py312-vllm031-swift46-sglang'

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 清理 GitHub Runner 磁盘，释放出 105GB+ 空间
      - name: Free Disk Space (105GB+)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. 本地构建镜像用于严格自检
      - name: Build Image Locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local-test:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. 自动化无 Bug 验证（验证所有 CLI、Jupyter、Agent 与大模型框架 C++ 符号表）
      - name: Verify All Frameworks, Jupyter & Agents
        run: |
          docker run --rm local-test:verify bash -c "
            set -e
            echo '=== [1/4] 检查系统与检索工具 ==='
            conda --version && tmux -V && nvitop --version
            rg --version | head -n 1 && fd --version && ast-grep --version
            jq --version && yq --version && gh --version | head -n 1
            nvcc --version | grep '13.3'

            echo '=== [2/4] 检查 JupyterLab / Notebook 与 AI Agent 工具链 ==='
            jupyter lab --version
            jupyter notebook --version
            jupyter kernelspec list | grep 'python312'
            node -v && npm -v && bun -v
            which herdr && herdr --help > /dev/null
            which pi && pi --version
            which ck && ck --version
            which qmd && qmd --help > /dev/null

            echo '=== [3/4] 检查 Python 3.12 与大模型框架/C++算子兼容性 ==='
            python -c '
          import sys, torch, transformers, modelscope, vllm, vllm._C, sglang, swift, jupyterlab
          assert sys.version_info[:2] == (3, 12), f\"Python version mismatch: {sys.version}\"
          print(\"✅ Python:       \", sys.version.split()[0])
          print(\"✅ PyTorch:      \", torch.__version__, \"(CUDA:\", torch.version.cuda, \")\")
          print(\"✅ Transformers: \", transformers.__version__)
          print(\"✅ vLLM:         \", vllm.__version__)
          print(\"✅ SGLang:       \", sglang.__version__)
          print(\"✅ ms-swift:     \", swift.__version__)
          print(\"✅ JupyterLab:   \", jupyterlab.__version__)
          '

            echo '=== [4/4] 检查核心框架 CLI 入口 ==='
            vllm --help > /dev/null
            swift --help > /dev/null
            python -m sglang.launch_server --help > /dev/null
            echo '🎉 全部验证 100% 通过！准备推送镜像...'
          "

      # 4. 登录并推送到 GitHub 官方镜像仓库 (GHCR)
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${OWNER_LOWER}/llm-env:${{ github.event.inputs.image_tag }}"
          docker tag local-test:verify "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "============================================================"
          echo "✅ 镜像构建并推送成功！拉取命令："
          echo "docker pull $IMAGE_URI"
          echo "============================================================"
