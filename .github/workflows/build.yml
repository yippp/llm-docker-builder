name: Build All-in-One LLM, VLM, RL & Decision Model Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag'
        required: true
        default: 'cu133-py312-vllm031-swift46-sglang-rl'

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (105GB+)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image Locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local-test:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify All Frameworks, VLM, RL, Decision Kernels & Agents
        run: |
          docker run --rm local-test:verify bash -c "
            set -e
            echo '=== [1/5] 检查系统工具、FFmpeg 与 CUDA 13.3 ==='
            conda --version && tmux -V && nvitop --version
            ffmpeg -version | head -n 1
            rg --version | head -n 1 && fd --version && ast-grep --version
            jq --version && yq --version && gh --version | head -n 1
            nvcc --version | grep '13.3'

            echo '=== [2/5] 检查 JupyterLab 与 AI Coding Agent 工具链 ==='
            jupyter lab --version
            jupyter notebook --version
            jupyter kernelspec list | grep 'python312'
            node -v && npm -v && bun -v
            which herdr && herdr --help > /dev/null
            which pi && pi --version
            which ck && ck --version
            which qmd && qmd --help > /dev/null

            echo '=== [3/5] 检查 LLM / VLM / RL / 决策模型 Python 栈兼容性 ==='
            python -c '
          import sys, torch, transformers, datasets, peft, trl, deepspeed
          import modelscope, vllm, vllm._C, sglang, swift
          import timm, decord, librosa, qwen_vl_utils, qwen_omni_utils
          import ray, math_verify, gymnasium, wandb, swanlab, fla

          assert sys.version_info[:2] == (3, 12), f\"Python version mismatch: {sys.version}\"
          print(\"✅ Python:       \", sys.version.split()[0])
          print(\"✅ PyTorch:      \", torch.__version__, \"(CUDA:\", torch.version.cuda, \")\")
          print(\"✅ Transformers: \", transformers.__version__)
          print(\"✅ Datasets:     \", datasets.__version__, \"(Locked <4.8.5 for Swift 4.6)\")
          print(\"✅ TRL (RLHF):   \", trl.__version__)
          print(\"✅ DeepSpeed:    \", deepspeed.__version__)
          print(\"✅ Ray (RL):     \", ray.__version__)
          print(\"✅ vLLM:         \", vllm.__version__)
          print(\"✅ SGLang:       \", sglang.__version__)
          print(\"✅ ms-swift:     \", swift.__version__)
          print(\"✅ FLA (Linear): \", fla.__version__)
          '

            echo '=== [4/5] 检查预置源码库 (Megatron-LM & StartLux-Decision) ==='
            ls -la /root/.cache/modelscope/_github/Megatron-LM
            ls -la /opt/StartLux-Decision

            echo '=== [5/5] 检查核心 CLI 入口 ==='
            vllm --help > /dev/null
            swift --help > /dev/null
            python -m sglang.launch_server --help > /dev/null
            echo '🎉 全栈 LLM + VLM + RL + Jev/StartLux 决策模型镜像 100% 验证通过！'
          "

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${OWNER_LOWER}/llm-env:${{ github.event.inputs.image_tag }}"
          docker tag local-test:verify "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "============================================================"
          echo "✅ 镜像构建并推送成功！拉取命令："
          echo "docker pull $IMAGE_URI"
          echo "============================================================"
